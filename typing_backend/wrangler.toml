name = "tsuka-typing-backend"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[[d1_databases]]
binding = "DB"
database_name = "tsuka-typing-db"
# `wrangler d1 create tsuka-typing-db` 実行後に発行される database_id に置き換えること
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
CORS_ORIGIN = "http://localhost:3000"

# SERVER_SECRET はリポジトリに含めない（秘密情報のため）。
#   - ローカル開発: .dev.vars に SERVER_SECRET=... を設定する
#   - 本番デプロイ: `wrangler secret put SERVER_SECRET` を実行して設定する
